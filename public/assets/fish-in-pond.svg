<svg width="800" height="600" viewBox="0 0 800 600" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <!-- Gradient for fish body -->
    <linearGradient id="fishGradient1" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#0891b2" />
      <stop offset="50%" style="stop-color:#06b6d4" />
      <stop offset="100%" style="stop-color:#22d3ee" />
    </linearGradient>
    
    <linearGradient id="fishGradient2" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#155e75" />
      <stop offset="50%" style="stop-color:#0891b2" />
      <stop offset="100%" style="stop-color:#06b6d4" />
    </linearGradient>
    
    <!-- Water ripple gradient -->
    <radialGradient id="waterRipple" cx="50%" cy="50%" r="50%">
      <stop offset="0%" style="stop-color:#22d3ee;stop-opacity:0" />
      <stop offset="70%" style="stop-color:#06b6d4;stop-opacity:0.3" />
      <stop offset="100%" style="stop-color:#0891b2;stop-opacity:0.6" />
    </radialGradient>
  </defs>
  
  <!-- Water background -->
  <rect width="800" height="600" fill="#0891b2" opacity="0.3"/>
  
  <!-- Water surface ripples -->
  <g opacity="0.4">
    <circle cx="150" cy="100" r="20" fill="url(#waterRipple)">
      <animate attributeName="r" values="10;30;10" dur="4s" repeatCount="indefinite"/>
    </circle>
    <circle cx="600" cy="200" r="25" fill="url(#waterRipple)">
      <animate attributeName="r" values="15;35;15" dur="6s" repeatCount="indefinite"/>
    </circle>
    <circle cx="300" cy="400" r="18" fill="url(#waterRipple)">
      <animate attributeName="r" values="8;28;8" dur="5s" repeatCount="indefinite"/>
    </circle>
  </g>
  
  <!-- Fish 1 - Large fish in center -->
  <g transform="translate(400,300)">
    <!-- Fish body -->
    <ellipse cx="0" cy="0" rx="80" ry="30" fill="url(#fishGradient1)" stroke="#164e63" stroke-width="2"/>
    <!-- Fish tail -->
    <polygon points="-80,-15 -120,-25 -120,25 -80,15" fill="url(#fishGradient1)" stroke="#164e63" stroke-width="2"/>
    <!-- Fish fins -->
    <ellipse cx="-20" cy="-25" rx="15" ry="8" fill="url(#fishGradient1)" stroke="#164e63" stroke-width="1"/>
    <ellipse cx="-20" cy="25" rx="15" ry="8" fill="url(#fishGradient1)" stroke="#164e63" stroke-width="1"/>
    <!-- Fish eye -->
    <circle cx="40" cy="-8" r="8" fill="white" stroke="#164e63" stroke-width="1"/>
    <circle cx="42" cy="-8" r="4" fill="#164e63"/>
    <!-- Animate fish movement -->
    <animateTransform attributeName="transform" type="translate" values="400,300; 450,280; 500,300; 450,320; 400,300" dur="10s" repeatCount="indefinite"/>
  </g>
  
  <!-- Fish 2 - Medium fish top right -->
  <g transform="translate(600,150)">
    <ellipse cx="0" cy="0" rx="50" ry="20" fill="url(#fishGradient2)" stroke="#0c4a6e" stroke-width="2"/>
    <polygon points="-50,-10 -75,-15 -75,15 -50,10" fill="url(#fishGradient2)" stroke="#0c4a6e" stroke-width="2"/>
    <ellipse cx="-15" cy="-15" rx="10" ry="5" fill="url(#fishGradient2)" stroke="#0c4a6e" stroke-width="1"/>
    <ellipse cx="-15" cy="15" rx="10" ry="5" fill="url(#fishGradient2)" stroke="#0c4a6e" stroke-width="1"/>
    <circle cx="25" cy="-5" r="6" fill="white" stroke="#0c4a6e" stroke-width="1"/>
    <circle cx="27" cy="-5" r="3" fill="#0c4a6e"/>
    <animateTransform attributeName="transform" type="translate" values="600,150; 550,130; 500,150; 550,170; 600,150" dur="12s" repeatCount="indefinite"/>
  </g>
  
  <!-- Fish 3 - Small fish bottom left -->
  <g transform="translate(200,450)">
    <ellipse cx="0" cy="0" rx="35" ry="15" fill="url(#fishGradient1)" stroke="#164e63" stroke-width="1"/>
    <polygon points="-35,-8 -50,-12 -50,12 -35,8" fill="url(#fishGradient1)" stroke="#164e63" stroke-width="1"/>
    <ellipse cx="-10" cy="-12" rx="8" ry="4" fill="url(#fishGradient1)" stroke="#164e63" stroke-width="1"/>
    <ellipse cx="-10" cy="12" rx="8" ry="4" fill="url(#fishGradient1)" stroke="#164e63" stroke-width="1"/>
    <circle cx="18" cy="-3" r="4" fill="white" stroke="#164e63" stroke-width="1"/>
    <circle cx="19" cy="-3" r="2" fill="#164e63"/>
    <animateTransform attributeName="transform" type="translate" values="200,450; 250,430; 300,450; 250,470; 200,450" dur="8s" repeatCount="indefinite"/>
  </g>
  
  <!-- Fish 4 - Small fish school -->
  <g opacity="0.8">
    <g transform="translate(150,250)">
      <ellipse cx="0" cy="0" rx="25" ry="10" fill="#06b6d4" stroke="#155e75" stroke-width="1"/>
      <polygon points="-25,-5 -35,-8 -35,8 -25,5" fill="#06b6d4"/>
      <circle cx="12" cy="-2" r="3" fill="white"/>
      <circle cx="13" cy="-2" r="1" fill="#155e75"/>
      <animateTransform attributeName="transform" type="translate" values="150,250; 180,240; 210,250; 180,260; 150,250" dur="6s" repeatCount="indefinite"/>
    </g>
    
    <g transform="translate(170,270)">
      <ellipse cx="0" cy="0" rx="20" ry="8" fill="#22d3ee" stroke="#155e75" stroke-width="1"/>
      <polygon points="-20,-4 -28,-6 -28,6 -20,4" fill="#22d3ee"/>
      <circle cx="10" cy="-1" r="2" fill="white"/>
      <circle cx="11" cy="-1" r="1" fill="#155e75"/>
      <animateTransform attributeName="transform" type="translate" values="170,270; 200,260; 230,270; 200,280; 170,270" dur="6s" repeatCount="indefinite"/>
    </g>
    
    <g transform="translate(190,230)">
      <ellipse cx="0" cy="0" rx="22" ry="9" fill="#0891b2" stroke="#155e75" stroke-width="1"/>
      <polygon points="-22,-4 -30,-7 -30,7 -22,4" fill="#0891b2"/>
      <circle cx="11" cy="-1" r="2" fill="white"/>
      <circle cx="12" cy="-1" r="1" fill="#155e75"/>
      <animateTransform attributeName="transform" type="translate" values="190,230; 220,220; 250,230; 220,240; 190,230" dur="6s" repeatCount="indefinite"/>
    </g>
  </g>
  
  <!-- Bubbles -->
  <g opacity="0.6">
    <circle cx="100" cy="500" r="3" fill="#f0f9ff">
      <animate attributeName="cy" values="500;50;500" dur="8s" repeatCount="indefinite"/>
    </circle>
    <circle cx="300" cy="550" r="2" fill="#f0f9ff">
      <animate attributeName="cy" values="550;100;550" dur="10s" repeatCount="indefinite"/>
    </circle>
    <circle cx="700" cy="480" r="4" fill="#f0f9ff">
      <animate attributeName="cy" values="480;80;480" dur="7s" repeatCount="indefinite"/>
    </circle>
  </g>
  
  <!-- Aquatic plants -->
  <g opacity="0.7">
    <path d="M50,600 Q60,500 70,400 Q65,450 60,500 Q55,550 50,600" fill="#16a34a" stroke="#15803d" stroke-width="2"/>
    <path d="M750,600 Q740,450 730,300 Q735,400 740,500 Q745,550 750,600" fill="#16a34a" stroke="#15803d" stroke-width="2"/>
    <path d="M400,600 Q410,500 420,400 Q415,450 410,500 Q405,550 400,600" fill="#22c55e" stroke="#16a34a" stroke-width="2"/>
  </g>
</svg>