name: Commit lint
on: [pull_request]

jobs:
  commitlint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install dependencies
        run: npm ci
      - name: Fetch base commit SHA
        run: |
          # Ensure the PR base commit is available in the runner
          git fetch --no-tags --prune origin ${{ github.event.pull_request.base.sha }} --depth=1 || true

      - name: Run commitlint
        run: npx commitlint --from=${{ github.event.pull_request.base.sha }} --to=${{ github.event.pull_request.head.sha }}
